# Dev-set matrix check for adapter A only (base + meridian arms).
# The adapter arrives as a registered model asset mounted into the job —
# it never round-trips through a laptop.
#   az ml job create -f train/azureml/job_devmatrix_a.yaml -g rg-multilora -w mlw-multilora
# Cost: a100-cluster ~$3.67/hr; expect ~30-40 min (base model download dominates).
$schema: https://azuremlschemas.azureedge.net/latest/commandJob.schema.json
experiment_name: multilora-eval
display_name: devmatrix-A
code: ../..
command: >-
  set -e;
  nvidia-smi --query-gpu=memory.used,memory.total --format=csv;
  (vllm serve nvidia/Llama-3.1-Nemotron-Nano-8B-v1
    --served-model-name base
    --enable-lora --max-lora-rank 16 --max-loras 4
    --lora-modules meridian=${{inputs.adapter_meridian}}
    --max-model-len 4096 --port 8000 > outputs/vllm_server.log 2>&1 &);
  for i in $(seq 1 120); do
    python3 -c "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/health', timeout=5)" 2>/dev/null && break; sleep 10;
  done;
  python3 -c "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/health', timeout=5)";
  echo "server healthy after ~$((i*10))s";
  nvidia-smi --query-gpu=memory.used,memory.total --format=csv;
  python3 eval/separation.py --endpoint http://127.0.0.1:8000
    --goals eval/dev_goals.jsonl --arms ${{inputs.arms}}
    --out-dir outputs/eval_logs --max-concurrency 4;
  nvidia-smi --query-gpu=memory.used,memory.total --format=csv;
  tail -5 outputs/vllm_server.log
inputs:
  arms: base,meridian
  adapter_meridian:
    type: custom_model
    path: azureml:adapter-meridian@latest
environment:
  image: vllm/vllm-openai:v0.27.1
compute: azureml:a100-cluster
